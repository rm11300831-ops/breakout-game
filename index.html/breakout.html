<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 16px; letter-spacing: 2px; color: #ccc; }
  #hud { display: flex; gap: 2rem; margin-bottom: 12px; font-size: 14px; color: #888; }
  #hud span { font-weight: 600; color: #fff; }
  #gameCanvas { border-radius: 12px; border: 1px solid #2a2a3a; background: #0a0a14; display: block; max-width: 100%; }
  #msg { margin-top: 14px; font-size: 14px; color: #888; text-align: center; min-height: 22px; }
  button { font-size: 14px; padding: 10px 28px; border-radius: 8px; border: 1px solid #444; background: transparent; color: #fff; cursor: pointer; margin-top: 14px; transition: background 0.15s; }
  button:hover { background: rgba(255,255,255,0.1); }
  #tip { margin-top: 20px; font-size: 12px; color: #444; }
</style>
</head>
<body>
<h1>打 砖 块</h1>
<div id="hud">分数：<span id="score">0</span>&nbsp;&nbsp;生命：<span id="lives">3</span>&nbsp;&nbsp;关卡：<span id="level">1</span></div>
<canvas id="gameCanvas" width="560" height="380"></canvas>
<p id="msg">点击下方按钮开始游戏</p>
<button id="startBtn">开始 / 重新开始</button>
<p id="tip">鼠标移动 或 触屏滑动 控制挡板</p>

<script>
(function() {
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var W = 560, H = 380;
  var COLORS = ['#5DCAA5','#7F77DD','#D4537E','#378ADD','#EF9F27'];
  var ROWS = 5, COLS = 10, BW = 48, BH = 16, BPAD = 4;
  var BRICK_OFF_X = (W - COLS*(BW+BPAD) + BPAD) / 2;
  var BRICK_OFF_Y = 40;

  var state = 'idle';
  var score = 0, lives = 3, level = 1;
  var ball, paddle, bricks, particles, animId;

  function initLevel() {
    paddle = { x: W/2 - 50, y: H - 28, w: 100, h: 12 };
    var spd = 4 + level * 0.4;
    var angle = -Math.PI/2 + (Math.random() - 0.5) * 0.6;
    ball = { x: W/2, y: H - 60, r: 7, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd };
    bricks = [];
    particles = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var hp = ROWS - r;
        bricks.push({ x: BRICK_OFF_X + c*(BW+BPAD), y: BRICK_OFF_Y + r*(BH+BPAD), w: BW, h: BH, hp: hp, maxHp: hp, color: COLORS[r % COLORS.length], alive: true });
      }
    }
  }

  function reset() {
    score = 0; lives = 3; level = 1;
    initLevel();
    state = 'playing';
    updateHud();
    document.getElementById('msg').textContent = '移动鼠标控制挡板';
  }

  function updateHud() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
    document.getElementById('level').textContent = level;
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i < 7; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 1.5 + Math.random() * 2.5;
      particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color: color });
    }
  }

  function update() {
    if (state !== 'playing') return;
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    if (ball.y - ball.r > H) {
      lives--;
      updateHud();
      if (lives <= 0) {
        state = 'over';
        document.getElementById('msg').textContent = '游戏结束！最终得分：' + score;
        return;
      }
      var spd = 4 + level * 0.4;
      var angle = -Math.PI/2 + (Math.random()-0.5)*0.6;
      ball = { x: paddle.x + paddle.w/2, y: paddle.y - 20, r: 7, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd };
    }

    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x &&
        ball.x - ball.r <= paddle.x + paddle.w) {
      var hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      var angle2 = hit * (Math.PI/3) - Math.PI/2;
      var spd2 = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
      ball.vx = Math.cos(angle2) * spd2;
      ball.vy = Math.sin(angle2) * spd2;
      ball.y = paddle.y - ball.r - 1;
    }

    var allGone = true;
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      allGone = false;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        var ol = (ball.x + ball.r) - b.x;
        var or2 = (b.x + b.w) - (ball.x - ball.r);
        var ot = (ball.y + ball.r) - b.y;
        var ob = (b.y + b.h) - (ball.y - ball.r);
        if (Math.min(ol, or2) < Math.min(ot, ob)) ball.vx = -ball.vx;
        else ball.vy = -ball.vy;
        b.hp--;
        score += 10;
        spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color);
        if (b.hp <= 0) { b.alive = false; score += 20; }
        updateHud();
        break;
      }
    }

    if (allGone) {
      level++;
      updateHud();
      initLevel();
      document.getElementById('msg').textContent = '第 ' + level + ' 关！加速了！';
      setTimeout(function() { if (state === 'playing') document.getElementById('msg').textContent = ''; }, 1800);
    }

    for (var j = 0; j < particles.length; j++) {
      particles[j].x += particles[j].vx;
      particles[j].y += particles[j].vy;
      particles[j].life -= 0.06;
    }
    particles = particles.filter(function(p) { return p.life > 0; });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.globalAlpha = 0.5 + 0.5 * (b.hp / b.maxHp);
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 3);
      ctx.fill();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 0.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#7F77DD';
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();

    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === 'idle' || state === 'over') {
      ctx.fillStyle = 'rgba(10,10,20,0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      ctx.font = '500 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state === 'over' ? '游戏结束 · 得分 ' + score : '打砖块', W/2, H/2 - 10);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('点击下方按钮开始', W/2, H/2 + 20);
      ctx.textAlign = 'left';
    }
  }

  function loop() {
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (W / rect.width);
    if (paddle) paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
  });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var tx = (e.touches[0].clientX - rect.left) * (W / rect.width);
    if (paddle) paddle.x = Math.max(0, Math.min(W - paddle.w, tx - paddle.w/2));
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', function() {
    if (animId) cancelAnimationFrame(animId);
    reset();
    loop();
  });

  draw();
})();
</script>
</body>
</html>
